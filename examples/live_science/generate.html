<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识之境 · 篇章生成</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4b77a;--gold-bright:#f0d9a8;--text:#e8e2d5;--text-dim:#9a92a8;--violet:#b49ae0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 20%,rgba(46,30,78,.6),#0b0714 75%);
  color:var(--text);font-family:'Noto Serif SC',serif;display:flex;flex-direction:column;align-items:center;
  padding:56px 20px 60px;}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.45em;color:var(--gold);
  font-size:14px;text-transform:uppercase;margin-bottom:14px;}
h1{font-size:clamp(30px,5vw,46px);letter-spacing:.24em;color:#fff;font-weight:700;
  text-shadow:0 0 44px rgba(212,183,122,.45);margin-bottom:10px;}
.desc{color:var(--text-dim);font-size:14px;letter-spacing:.12em;margin-bottom:44px;text-align:center;line-height:2;}
.card{width:min(94vw,620px);border:1px solid rgba(212,183,122,.3);border-radius:18px;
  background:linear-gradient(165deg,rgba(26,18,46,.9),rgba(10,7,20,.95));padding:30px 34px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);}
label{display:block;font-size:12.5px;color:var(--text-dim);letter-spacing:.15em;margin-bottom:8px;}
#topic{width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(212,183,122,.35);border-radius:10px;
  padding:14px 18px;color:var(--text);font-family:inherit;font-size:16px;outline:none;margin-bottom:22px;
  transition:border-color .3s;}
#topic:focus{border-color:var(--gold);}
.auds{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
.aud{padding:8px 18px;border-radius:999px;border:1px solid rgba(212,183,122,.3);background:transparent;
  color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .3s;letter-spacing:.08em;font-family:inherit;}
.aud.on{border-color:var(--gold);color:var(--gold-bright);background:rgba(212,183,122,.12);}
.btn-gen{width:100%;padding:15px;border:1px solid var(--gold);border-radius:999px;background:transparent;
  color:var(--gold-bright);font-family:inherit;font-size:16px;letter-spacing:.3em;cursor:pointer;transition:all .35s;}
.btn-gen:hover:not(:disabled){background:rgba(212,183,122,.14);box-shadow:0 0 30px rgba(212,183,122,.3);}
.btn-gen:disabled{opacity:.4;cursor:not-allowed;}
#progress{display:none;margin-top:26px;}
.stage-line{display:flex;align-items:center;gap:12px;padding:12px 4px;font-size:14px;letter-spacing:.06em;
  color:var(--text-dim);border-bottom:1px dashed rgba(212,183,122,.12);}
.stage-line .dot{width:9px;height:9px;border-radius:50%;background:rgba(212,183,122,.2);flex:none;}
.stage-line.active{color:var(--gold-bright);}
.stage-line.active .dot{background:var(--gold-bright);box-shadow:0 0 10px rgba(240,217,168,.8);animation:pulse 1.4s infinite;}
.stage-line.done{color:var(--text);}
.stage-line.done .dot{background:var(--gold);}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
#gen-msg{margin-top:16px;font-size:13px;color:var(--violet);letter-spacing:.05em;line-height:1.9;min-height:24px;}
#gen-link{display:none;margin-top:18px;text-align:center;}
#gen-link a{display:inline-block;padding:13px 44px;border:1px solid var(--gold);border-radius:999px;
  color:var(--gold-bright);text-decoration:none;letter-spacing:.25em;font-size:15px;transition:all .3s;}
#gen-link a:hover{background:rgba(212,183,122,.14);box-shadow:0 0 26px rgba(212,183,122,.35);}
.back{display:block;margin-top:30px;color:var(--text-dim);font-size:12.5px;letter-spacing:.2em;
  text-decoration:none;text-align:center;}
.back:hover{color:var(--gold);}
</style>
</head>
<body>
<div class="sub">Realm of Knowledge · Factory</div>
<h1>篇 章 生 成</h1>
<div class="desc">输入一个科学主题，从调研科学史开始——剧本、场景 CG、配音、实验、课本衔接<br>全部由 AI 现场打造，约 3-6 分钟</div>

<div class="card">
  <label>科学主题（数理化生等）</label>
  <input id="topic" placeholder="如：万有引力 / 进化论 / 电磁感应 / 光合作用……" maxlength="30">
  <label>受众画像</label>
  <div class="auds" id="auds">
    <button class="aud" data-v="elementary">小学</button>
    <button class="aud" data-v="middle">初中</button>
    <button class="aud on" data-v="high">高中</button>
    <button class="aud" data-v="university">大学</button>
    <button class="aud" data-v="public">大众</button>
  </div>
  <button class="btn-gen" id="btn-gen">开 始 打 造</button>

  <div id="progress">
    <div class="stage-line" data-s="story"><span class="dot"></span>调研科学史 · 撰写剧本</div>
    <div class="stage-line" data-s="images"><span class="dot"></span>生成场景 CG（电影级画面）</div>
    <div class="stage-line" data-s="assemble"><span class="dot"></span>装配篇章</div>
    <div id="gen-msg"></div>
    <div id="gen-link"><a href="#" id="go-link">进 入 篇 章 →</a></div>
  </div>
</div>

<a class="back" href="/">← 返回知识之境</a>

<script>
let audience='high';
document.querySelectorAll('.aud').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('.aud').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); audience=b.dataset.v; };
});


let polling=null;
document.getElementById('btn-gen').onclick=async ()=>{
  const topic=document.getElementById('topic').value.trim();
  if(!topic){ document.getElementById('topic').focus(); return; }
  const btn=document.getElementById('btn-gen');
  btn.disabled=true; btn.textContent='打 造 中 …';
  document.getElementById('progress').style.display='block';
  document.getElementById('gen-link').style.display='none';
  document.querySelectorAll('.stage-line').forEach(s=>s.className='stage-line');
  try{
    const r=await fetch('/api/demo/live-science/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic, audience})});
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||'生成启动失败');
    poll(d.job, topic);
  }catch(e){
    document.getElementById('gen-msg').textContent='⚠ '+e.message;
    btn.disabled=false; btn.textContent='开 始 打 造';
  }
};

function poll(job, topic){
  const stages=['story','images','assemble'];
  polling=setInterval(async ()=>{
    try{
      const r=await fetch('/api/demo/live-science/generate/status?job='+job);
      const d=await r.json();
      document.getElementById('gen-msg').textContent=d.message||'';
      const idx=stages.indexOf(d.stage);
      document.querySelectorAll('.stage-line').forEach(s=>{
        const si=stages.indexOf(s.dataset.s);
        s.className='stage-line'+(si<idx?' done':si===idx?' active':'');
      });
      if(d.stage==='done'){
        clearInterval(polling);
        document.querySelectorAll('.stage-line').forEach(s=>s.className='stage-line done');
        const link='chapters/'+d.slug+'/index.html';
        const gl=document.getElementById('gen-link'); gl.style.display='block';
        document.getElementById('go-link').href=link;
        const btn=document.getElementById('btn-gen');
        btn.disabled=false; btn.textContent='再 造 一 篇';
      } else if(d.stage==='error'||d.stage==='unknown'){
        clearInterval(polling);
        document.getElementById('gen-msg').textContent='⚠ '+(d.message||'生成失败');
        const btn=document.getElementById('btn-gen');
        btn.disabled=false; btn.textContent='重 试';
      }
    }catch(e){ /* 网络抖动，继续轮询 */ }
  }, 3000);
}
</script>
</body>
</html>
