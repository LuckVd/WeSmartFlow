    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8A9780" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.7" fill="#9D9C88" opacity="0.5"/></pattern>
  </defs>
  <rect width="1200" height="1192" rx="24" fill="#FFFBF1"/>
