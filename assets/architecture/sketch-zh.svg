<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1192" viewBox="0 0 1200 1192" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">WeSmartFlow 系统架构</title>
  <desc id="desc">网页、独立探索主题与微信入口接入教育业务服务。业务通过 Agent 注册表使用 agent_core，并读写个人学习记忆和公共知识图谱。业务负责持久化，模型与工具通过适配器接入外部能力。</desc>
